services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudmart_postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cloudmart}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bound to localhost only to avoid exposing database publicly in dev
      - "127.0.0.1:5432:5432"
    volumes:
      - cloudmart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudmart} -d ${POSTGRES_DB:-cloudmart}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cloudmart_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudmart_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cloudmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cloudmart}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudmart}:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/${POSTGRES_DB:-cloudmart}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-64-char-secret-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cloudmart.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme_admin_dev_only}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Mount backend directory for hot reload during development
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudmart_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cloudmart_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      # Mount src directory for dev hot reload
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
    networks:
      - cloudmart_network

networks:
  cloudmart_network:
    name: cloudmart_network
    driver: bridge

volumes:
  cloudmart_postgres_data:
    name: cloudmart_postgres_data
    driver: local


