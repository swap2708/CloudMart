apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudmart-config
  namespace: cloudmart
  labels:
    app.kubernetes.io/name: cloudmart
    app.kubernetes.io/part-of: cloudmart
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cloudmart"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  ENVIRONMENT: "production"
  VITE_API_URL: "/api"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "cloudmart-media-bucket"
