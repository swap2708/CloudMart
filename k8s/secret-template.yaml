# ==============================================================================
# CloudMart - Secret Template (EXAMPLE ONLY - DO NOT COMMIT REAL CREDENTIALS)
# ==============================================================================
# To create this secret in your cluster, choose ONE of the following methods:
#
# Method 1 (Recommended - using kubectl command directly):
# ------------------------------------------------------------------------------
# kubectl create secret generic cloudmart-secrets \
#   --namespace=cloudmart \
#   --from-literal=POSTGRES_USER=cloudmart \
#   --from-literal=POSTGRES_PASSWORD=YOUR_SECURE_PASSWORD \
#   --from-literal=SECRET_KEY=YOUR_SECURE_RANDOM_64_CHAR_KEY \
#   --from-literal=ADMIN_EMAIL=admin@cloudmart.dev \
#   --from-literal=ADMIN_PASSWORD=YOUR_SECURE_ADMIN_PASSWORD \
#   --from-literal=AWS_ACCESS_KEY_ID=YOUR_AWS_KEY_ID \
#   --from-literal=AWS_SECRET_ACCESS_KEY=YOUR_AWS_SECRET_KEY
#
# Method 2 (Using base64 encoded manifest):
# ------------------------------------------------------------------------------
# 1. Copy this file to a gitignored file: `cp secret-template.yaml secret.yaml`
# 2. Encode your sensitive values:
#    In Linux/macOS: echo -n 'your_value' | base64
#    In PowerShell:  [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('your_value'))
# 3. Replace the placeholder values below with the base64 strings
# 4. Apply the manifest: `kubectl apply -f secret.yaml`
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: cloudmart-secrets
  namespace: cloudmart
  labels:
    app.kubernetes.io/name: cloudmart
    app.kubernetes.io/part-of: cloudmart
type: Opaque
stringData:
  POSTGRES_USER: "cloudmart"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_DB_PASSWORD"
  SECRET_KEY: "REPLACE_WITH_SECURE_RANDOM_64_CHAR_SECRET_KEY"
  ADMIN_EMAIL: "admin@cloudmart.dev"
  ADMIN_PASSWORD: "REPLACE_WITH_SECURE_ADMIN_PASSWORD"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
